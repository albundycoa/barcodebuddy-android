plugins {
    id 'com.android.application'
}

def appVersion = property("appVersion")
def (vMajor, vMinor, vPatch) = appVersion.tokenize('.').collect { it as int }

// Gleicher Schlüssel wie die Handy-App. Die Data Layer von Google (Daten und Befehle zwischen Handy und Uhr) lässt nur
// Apps miteinander reden, die die gleiche Paketkennung UND die gleiche Signatur haben ("Mismatched certificate").
def keyDir = new File(System.getProperty('user.home'), '.barcodebuddy-keys')
def keyProps = new Properties()
def keyFile = new File(keyDir, 'keystore.properties')
if (keyFile.exists()) {
    keyFile.withInputStream { keyProps.load(it) }
}

android {
    namespace 'de.bulling.barcodebuddyscanner.wear'
    compileSdk 37

    defaultConfig {
        // Gleiche Kennung wie die Handy-App: nur so tauschen beide Apps Daten über die Data Layer aus
        applicationId "de.bulling.barcodebuddyscanner"
        minSdkVersion 30
        targetSdkVersion 34
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName appVersion
    }

    signingConfigs {
        shared {
            if (keyFile.exists()) {
                storeFile file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            if (keyFile.exists()) {
                signingConfig signingConfigs.shared
            }
        }
        release {
            minifyEnabled false
            if (keyFile.exists()) {
                signingConfig signingConfigs.shared
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.code.gson:gson:2.14.0'
}

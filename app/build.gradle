plugins {
    id 'com.android.application'
}

// Version der App. Der Versionscode steigt mit der Version (X*10000 + Y*100 + Z) und darf nie zurückgehen,
// sonst lässt sich ein Update nicht mehr einspielen.
def appVersion = "0.1.0"
def (vMajor, vMinor, vPatch) = appVersion.tokenize('.').collect { it as int }

// Schlüssel für die veröffentlichten APKs: liegt außerhalb des Repositorys unter ~/.barcodebuddy-keys
def keyDir = new File(System.getProperty('user.home'), '.barcodebuddy-keys')
def keyProps = new Properties()
def keyFile = new File(keyDir, 'keystore.properties')
if (keyFile.exists()) {
    keyFile.withInputStream { keyProps.load(it) }
}

android {
    namespace 'de.bulling.barcodebuddyscanner'
    compileSdk 37

    defaultConfig {
        applicationId "de.bulling.barcodebuddyscanner"
        minSdkVersion 24
        targetSdkVersion 37
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        // Enables BuildConfig generation locally for this module
        buildConfig true
    }

    signingConfigs {
        release {
            if (keyFile.exists()) {
                storeFile file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Ohne Schlüssel (z. B. in der GitHub-Action) bleibt die APK unsigniert
            if (keyFile.exists()) {
                signingConfig signingConfigs.release
            }
        }

        // Zum Entwickeln und Testen: debugbar, aber mit dem gleichen Schlüssel wie die Release-APK, damit sich
        // beide gegenseitig überinstallieren lassen. Ohne Schlüssel gilt der Debug-Schlüssel.
        debugPublic {
            debuggable true
            signingConfig keyFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // AndroidX & Material UI
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    // Herunterziehen zum Aktualisieren
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // Synchronisierung mit Grocy im Hintergrund
    implementation 'androidx.work:work-runtime:2.10.0'

    // Verbindung zur Wear-OS-Uhr (Data Layer)
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'

    // Gson for JSON parsing:
    implementation 'com.google.code.gson:gson:2.14.0'

    // Barcode Scanner
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}